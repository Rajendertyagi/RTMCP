name: Build Native Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run lint

      - name: Compile native Windows executable
        run: bun build --compile --minify --target=bun-windows-x64-modern ./src/index.ts --outfile indian-option-mcp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indian-option-mcp-windows
          path: indian-option-mcp.exe
